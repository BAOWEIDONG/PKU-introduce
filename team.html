<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f6fa" />
  <meta name="description" content="北大医疗师资团队：57 位专家、726 位医师、107 位专科护士与健康营运营团队，支持按姓名、科室搜索。" />
  <title>师资团队 · 北大医疗</title>
  <link rel="icon" href="./assets/logo.png" />
  <link rel="stylesheet" href="./ios.css" />
  <link rel="stylesheet" href="./views.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <script src="./icons.js"></script>

  <header class="topbar">
    <a class="back-btn" href="./mobile.html">
      <svg class="ic ic-18"><use href="#i-back"/></svg>首页
    </a>
    <span class="topbar-spacer"></span>
    <span class="topbar-title">师资团队</span>
    <span class="topbar-spacer"></span>
    <a class="icon-btn" href="./camp.html" aria-label="本期健康营">
      <svg class="ic ic-18"><use href="#i-activity"/></svg>
    </a>
  </header>

  <main class="page">
    <section class="team-hero-card">
      <p class="eyebrow" style="color:rgba(255,255,255,.55)">FACULTY &amp; CARE TEAM</p>
      <h1>师资团队</h1>
      <p>临床专家、专科医师、国际护理与健康管理团队，来自北医系统与北大医疗成员机构。</p>
      <div class="team-hero-stats">
        <span><b id="heroExperts">57</b><small>位专家</small></span>
        <span><b id="heroDoctors">726</b><small>位医师</small></span>
        <span><b id="heroNurses">107</b><small>专科护士</small></span>
        <span><b id="heroDepts">70</b><small>个科室</small></span>
      </div>
    </section>

    <div class="team-toolbar">
      <div class="search">
        <svg class="ic ic-18"><use href="#i-search"/></svg>
        <input id="teamSearch" type="search" placeholder="搜索姓名、科室或擅长方向" autocomplete="off" aria-label="搜索师资团队" />
        <button class="search-clear" type="button" aria-label="清空搜索"><svg class="ic ic-16"><use href="#i-close"/></svg></button>
      </div>
      <div class="segmented" id="teamTabs" style="margin-top:10px" role="tablist" aria-label="团队分类"></div>
    </div>

    <div class="result-line"><span id="teamResult">正在加载…</span><span id="teamHint"></span></div>

    <div id="teamContent">
      <div class="person-list">
        <div class="person skeleton-row"><span class="sk sk-avatar"></span><span class="sk-lines"><span class="sk sk-line w60"></span><span class="sk sk-line w40"></span></span></div>
        <div class="person skeleton-row"><span class="sk sk-avatar"></span><span class="sk-lines"><span class="sk sk-line w55"></span><span class="sk sk-line w35"></span></span></div>
        <div class="person skeleton-row"><span class="sk sk-avatar"></span><span class="sk-lines"><span class="sk sk-line w65"></span><span class="sk sk-line w45"></span></span></div>
      </div>
    </div>

    <div class="empty-state hide" id="teamEmpty">
      <b>没有找到匹配成员</b>
      <p>换个关键词，或切换分类后再试。</p>
      <button class="btn btn-ghost" type="button" id="teamEmptyReset">查看全部</button>
    </div>

    <button class="btn btn-ghost btn-block hide" type="button" id="loadMore" style="margin-top:16px">加载更多</button>

    <footer class="footer">
      <img src="./assets/logo.png" alt="北大医疗" />
      <p>北大医疗 · 北京大学国际医院</p>
      <p>师资数据来自医院公开团队信息</p>
    </footer>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <a href="./mobile.html"><svg class="ic"><use href="#i-home"/></svg><span>首页</span></a>
    <a class="is-active" href="./team.html" aria-current="page"><svg class="ic"><use href="#i-users"/></svg><span>师资</span></a>
    <a href="./camp.html"><svg class="ic"><use href="#i-activity"/></svg><span>健康营</span></a>
    <a href="./hospitals.html"><svg class="ic"><use href="#i-building"/></svg><span>分院</span></a>
  </nav>

  <div class="backdrop" id="appBackdrop"></div>
  <div class="toast" id="appToast" role="status" aria-live="polite"></div>

  <script src="./team-experts-data.js"></script>
  <script src="./operations-team-data.js"></script>
  <script src="./departments-index.js"></script>
  <script src="./camp-data.js"></script>
  <script src="./app.js"></script>
  <script src="./faculty.js"></script>
</body>
</html>
