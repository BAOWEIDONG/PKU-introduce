<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f6fa" />
  <meta name="description" content="北大医疗师资与项目团队成员介绍。" />
  <title>成员介绍 · 北大医疗</title>
  <link rel="icon" href="./assets/logo.png" />
  <link rel="stylesheet" href="./ios.css?v=20261106" />
  <link rel="stylesheet" href="./views.css?v=20261106" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <script src="./icons.js?v=20261106" onerror="this.onerror=null;this.src='./icons.js?r='+Date.now()"></script>

  <header class="topbar">
    <a class="back-btn" href="./team.html" id="backLink">
      <svg class="ic ic-18"><use href="#i-back"/></svg>返回
    </a>
    <span class="topbar-spacer"></span>
    <span class="topbar-title" id="topTitle">成员介绍</span>
    <span class="topbar-spacer"></span>
    <span style="width:40px"></span>
  </header>

  <main class="page no-tabs" id="profileContent" style="padding-top:calc(var(--safe-top) + 72px)">
    <div class="profile-hero">
      <span class="sk" style="width:88px;height:88px;border-radius:26px"></span>
      <div class="sk sk-line w60" style="height:26px;margin-top:22px;border-radius:8px"></div>
      <div class="sk sk-line w40" style="margin-top:12px"></div>
      <div class="sk sk-line w55" style="margin-top:10px"></div>
    </div>
  </main>

  <footer class="footer">
    <img src="./assets/logo.png" alt="北大医疗" />
    <p>北大医疗 · 北京大学国际医院</p>
    <p>师资与项目团队</p>
  </footer>

  <div class="backdrop" id="appBackdrop"></div>
  <div class="toast" id="appToast" role="status" aria-live="polite"></div>

  <script src="./camp-data.js?v=20261106" onerror="this.onerror=null;this.src='./camp-data.js?r='+Date.now()"></script>
  <script src="./app.js?v=20261106" onerror="this.onerror=null;this.src='./app.js?r='+Date.now()"></script>
  <script src="./profile.js?v=20261106" onerror="this.onerror=null;this.src='./profile.js?r='+Date.now()"></script>
  <script>
    window.__pageReady = false;
    setTimeout(function () {
      if (window.__pageReady) return;
      var sk = document.querySelector('.skeleton-card, .skeleton-row, #profileContent .sk, #deptContent .sk');
      if (!sk) return;
      var box = sk.closest('.scroller, #teamContent, #profileContent, #deptContent') || sk.parentNode;
      if (box) box.innerHTML = '<div class="load-slow"><b>内容加载较慢</b><p>网络似乎不太稳定，请稍后重试。</p><button type="button" onclick="location.reload()">重新加载</button></div>';
    }, 6000);
  </script>
<script src="https://baoweidong.github.io/pku-console/assets/pku-bridge.js?v=2" data-channel="brand"></script>
</body>
</html>
