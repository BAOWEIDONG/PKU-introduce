<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f6fa" />
  <meta name="description" content="北京大学国际医院科室介绍、学科带头人与医生团队。" />
  <title>科室介绍 · 北京大学国际医院</title>
  <link rel="icon" href="./assets/logo.png" />
  <link rel="stylesheet" href="./ios.css?v=20261106" />
  <link rel="stylesheet" href="./views.css?v=20261106" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <script src="./icons.js?v=20261106" onerror="this.onerror=null;this.src='./icons.js?r='+Date.now()"></script>

  <header class="topbar">
    <a class="back-btn" href="./team.html?view=departments">
      <svg class="ic ic-18"><use href="#i-back"/></svg>科室
    </a>
    <span class="topbar-spacer"></span>
    <span class="topbar-title" id="deptTopTitle">科室介绍</span>
    <span class="topbar-spacer"></span>
    <span style="width:40px"></span>
  </header>

  <main class="page no-tabs" id="deptContent" style="padding-top:calc(var(--safe-top) + 72px)">
    <div class="dept-hero">
      <div class="sk sk-line w30" style="height:12px"></div>
      <div class="sk sk-line w60" style="height:30px;margin-top:14px;border-radius:8px"></div>
      <div class="sk sk-line w80" style="margin-top:16px"></div>
      <div class="sk sk-line w70" style="margin-top:8px"></div>
    </div>
  </main>

  <footer class="footer">
    <img src="./assets/logo.png" alt="北大医疗" />
    <p>北京大学国际医院 · 科室介绍</p>
  </footer>

  <div class="backdrop" id="appBackdrop"></div>
  <div class="toast" id="appToast" role="status" aria-live="polite"></div>

  <script src="./departments-data.js?v=20261106" onerror="this.onerror=null;this.src='./departments-data.js?r='+Date.now()"></script>
  <script src="./app.js?v=20261106" onerror="this.onerror=null;this.src='./app.js?r='+Date.now()"></script>
  <script src="./dept-view.js?v=20261106" onerror="this.onerror=null;this.src='./dept-view.js?r='+Date.now()"></script>
  <script>
    window.__pageReady = false;
    setTimeout(function () {
      if (window.__pageReady) return;
      var sk = document.querySelector('.skeleton-card, .skeleton-row, #profileContent .sk, #deptContent .sk');
      if (!sk) return;
      var box = sk.closest('.scroller, #teamContent, #profileContent, #deptContent') || sk.parentNode;
      if (box) box.innerHTML = '<div class="load-slow"><b>内容加载较慢</b><p>网络似乎不太稳定，请稍后重试。</p><button type="button" onclick="location.reload()">重新加载</button></div>';
    }, 6000);
  </script>
<script src="https://baoweidong.github.io/pku-console/assets/pku-bridge.js?v=2" data-channel="brand"></script>
</body>
</html>
